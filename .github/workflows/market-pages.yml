name: Generate Market Report

on:
  workflow_dispatch:
  schedule:
    - cron: "35 9 * * 1-5"
      timezone: America/Chicago
    - cron: "0 14 * * 1-5"
      timezone: America/Chicago

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      EXECUTION_MODE: signal_only
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ai-trading-agent
        run: python -m pip install -e ".[alpaca]"
      - name: Refresh S&P 500 universe
        working-directory: ai-trading-agent
        run: python scripts/refresh_sp500.py
      - name: Generate report
        working-directory: ai-trading-agent
        run: python reports/build_live_report.py
      - name: Persist sector history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-trading-agent/reports/sector_history.json
          git diff --cached --quiet || git commit -m "data: update sector score history"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ai-trading-agent/reports/site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
