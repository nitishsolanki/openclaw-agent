name: Generate Market Report

on:
  workflow_dispatch:
    inputs:
      fresh_scan:
        description: "Refresh stock universe and run all Python profiles"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "35 9 * * 1-5"
      timezone: America/Chicago
    - cron: "0 14 * * 1-5"
      timezone: America/Chicago

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      EXECUTION_MODE: signal_only
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ai-trading-agent
        run: python -m pip install -e ".[alpaca]"
      - name: Refresh S&P 500 universe
        if: ${{ github.event_name == 'schedule' || inputs.fresh_scan == true }}
        working-directory: ai-trading-agent
        run: python scripts/refresh_sp500.py
      - name: Refresh active theme
        if: ${{ github.event_name == 'schedule' || inputs.fresh_scan == true }}
        working-directory: ai-trading-agent
        run: python scripts/refresh_theme.py
      - name: Generate Python candidates
        if: ${{ github.event_name == 'schedule' || inputs.fresh_scan == true }}
        working-directory: ai-trading-agent
        run: python scripts/generate_python_candidates.py
      - name: Upload Python candidates
        if: ${{ github.event_name == 'schedule' || inputs.fresh_scan == true }}
        uses: actions/upload-artifact@v4
        with:
          name: python-candidates
          path: ai-trading-agent/reports/python_candidates.json
