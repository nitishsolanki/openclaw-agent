name: Deploy Market Intelligence

on:
  push:
    paths:
      - "ai-trading-agent/reports/site/**"
      - "ai-trading-agent/reports/latest.json"
      - "ai-trading-agent/reports/research_enrichment.json"
      - "ai-trading-agent/reports/openclaw_research_prompt.md"
      - "ai-trading-agent/reports/generate_site.py"
      - "ai-trading-agent/reports/styles.css"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild report site
        working-directory: ai-trading-agent
        run: |
          test -f reports/latest.json
          python reports/generate_site.py --input reports/latest.json --output reports/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ai-trading-agent/reports/site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
