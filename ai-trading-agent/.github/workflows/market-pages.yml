name: Generate Market Report
# Manual dispatch is enabled for one-click report generation from Actions.

on:
  workflow_dispatch:
  schedule:
    - cron: "35 9 * * 1-5"
      timezone: America/Chicago
    - cron: "0 14 * * 1-5"
      timezone: America/Chicago

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      EXECUTION_MODE: signal_only
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[alpaca]"
      - name: Generate report
        run: python scripts/generate_python_candidates.py
      - name: Upload Python candidates
        uses: actions/upload-artifact@v4
        with:
          name: python-candidates
          path: reports/python_candidates.json
