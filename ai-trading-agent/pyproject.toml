[project]
name = "ai-trading-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
api = ["fastapi>=0.100", "uvicorn>=0.20"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
